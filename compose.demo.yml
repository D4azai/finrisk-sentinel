# Explicit local-only application demo. Does not configure a live provider or broker.
services:
  api:
    healthcheck:
      timeout: 15s
      start_period: 60s
      retries: 5
    environment:
      API_ALLOW_DEMO_MARKET_DATA: "true"
      API_ENABLE_PAPER_TRADING: "true"
      API_ENABLE_DEV_LOGIN: "true"
  dev_identity:
    healthcheck:
      timeout: 15s
      start_period: 60s
      retries: 5
