name: pipeline-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -m "not integration"
      - name: Verify exported contracts and dependency hashes
        run: |
          uv run python scripts/export_contracts.py
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock --quiet
          git diff --exit-code -- contracts requirements.lock
      - name: Audit runtime dependencies
        run: uvx pip-audit -r requirements.lock --disable-pip --no-deps
      - name: Build and test the real pipeline
        run: |
          uv run python scripts/init_local_env.py
          docker compose -f docker-compose.yml -f compose.test.yml build
          docker compose -f docker-compose.yml -f compose.test.yml run --rm tests
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.yml -f compose.test.yml down
