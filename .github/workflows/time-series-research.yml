name: statistical-time-series-research

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "services/analytics/statistical_research.py"
      - "tests/test_statistical_research.py"
      - ".github/workflows/time-series-research.yml"
  push:
    branches: [staging, main]
    paths:
      - "services/analytics/statistical_research.py"
      - "tests/test_statistical_research.py"
      - ".github/workflows/time-series-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-statistical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent research-only dependencies
        run: python -m pip install "numpy>=1.26,<3" "statsmodels>=0.14,<0.16" "pytest>=9,<10"
      - name: Run forecasting, quality and break-analysis tests
        run: python -m pytest -q tests/test_statistical_research.py
