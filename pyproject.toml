[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"
[project]
name = "finrisk-sentinel"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["aiokafka>=0.12,<0.14", "asyncpg>=0.30,<0.32", "aiohttp>=3.12,<4", "pydantic>=2.12,<3", "pydantic-settings>=2.12,<3", "prometheus-client>=0.23,<1", "websockets>=15,<18", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "PyJWT[crypto]>=2.10,<3"]
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1", "jsonschema>=4,<5", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["services*"]
[tool.setuptools.package-data]
"services.common" = ["migrations/*.sql"]
"services.api" = ["static/*"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["services", "tests"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL and Kafka"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
