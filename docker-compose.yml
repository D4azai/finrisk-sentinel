version: '3.8'

services:
  market_data:
    build:
      context: ./services/market_data
      dockerfile: Dockerfile
    container_name: market_data_service
    environment:
      - MARKET_DATA_EXCHANGE_NAME=binance
      - MARKET_DATA_SYMBOLS=["btcusdt","ethusdt"]
      - MARKET_DATA_ZMQ_PUB_ENDPOINT=tcp://0.0.0.0:5555
    ports:
      - "5555:5555"
    restart: unless-stopped

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: ingestion_service
    depends_on:
      - market_data
    environment:
      - INGESTION_ZMQ_SUB_ENDPOINT=tcp://market_data:5555
      - INGESTION_ZMQ_CLEAN_PUB_ENDPOINT=tcp://0.0.0.0:5556
    ports:
      - "5556:5556"
    restart: unless-stopped